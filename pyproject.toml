[project]
name = "explore-diabetes-data"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Oleksandra Menzatiuk", email = "oleksandra.menzatiuk@silicon-austria.com" }
]
requires-python = ">=3.8"
dependencies = [
    "icecream>=2.2.0",
    "matplotlib>=3.7.5",
    "openpyxl>=3.1.5",
    "pandas>=2.0.3",
    "path>=17.0.0",
    "plotly>=7.1.0",
    "scipy>=1.10.1",
    "xlrd>=2.0.2",
]

[project.scripts]
explore-diabetes-data = "explore_diabetes_data:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
]
